name: Fetch Substack Posts

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-posts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Fetch RSS and convert to JSON
        run: |
          python3 - <<'EOF'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import re
          from datetime import datetime, timezone

          url = "https://bottbott.substack.com/feed"
          req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0 (compatible; BottBott/1.0)"})
          with urllib.request.urlopen(req, timeout=15) as response:
              xml_content = response.read()

          root = ET.fromstring(xml_content)
          channel = root.find('channel')
          items = channel.findall('item')

          posts = []
          for item in items[:1]:
              title = item.findtext('title', '').strip()
              link = item.findtext('link', '').strip()
              pub_date = item.findtext('pubDate', '').strip()
              description = item.findtext('description', '')
              excerpt = re.sub(r'<[^>]*>', '', description)[:120].strip()
              posts.append({
                  "title": title,
                  "link": link,
                  "pubDate": pub_date,
                  "excerpt": excerpt
              })

          output = {
              "posts": posts,
              "updated": datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          }

          with open("posts.json", "w") as f:
              json.dump(output, f, indent=2)

          print(f"Fetched: {posts[0]['title'] if posts else 'no posts'}")
          EOF
      
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || git commit -m "Update posts $(date -u +%Y-%m-%d)"
          git push
