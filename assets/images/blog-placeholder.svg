<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="presentation" aria-hidden="true">
  <!-- BottBott blog card placeholder — dark navy / gold design system.
       Used by lib/blog.js when a post has no featured image. -->
  <defs>
    <linearGradient id="bb-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#131f2b"/>
      <stop offset="100%" stop-color="#0a141d"/>
    </linearGradient>
    <pattern id="bb-dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#C4923A" fill-opacity="0.14"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#bb-bg)"/>
  <rect width="800" height="450" fill="url(#bb-dots)"/>

  <!-- Node-graph glyph: a small system, drawn in gold -->
  <g stroke="#C4923A" stroke-opacity="0.55" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M300 225 H360"/>
    <path d="M440 225 H500"/>
    <path d="M400 185 V145"/>
    <path d="M400 265 V305"/>
  </g>

  <g fill="#17232f" stroke="#C4923A" stroke-width="2.5">
    <circle cx="400" cy="225" r="40" stroke-opacity="0.9"/>
    <circle cx="280" cy="225" r="20" stroke-opacity="0.5"/>
    <circle cx="520" cy="225" r="20" stroke-opacity="0.5"/>
    <circle cx="400" cy="125" r="20" stroke-opacity="0.5"/>
    <circle cx="400" cy="325" r="20" stroke-opacity="0.5"/>
  </g>

  <circle cx="400" cy="225" r="11" fill="#C4923A"/>

  <rect x="0.75" y="0.75" width="798.5" height="448.5" fill="none" stroke="#C4923A" stroke-opacity="0.35" stroke-width="1.5"/>
</svg>
